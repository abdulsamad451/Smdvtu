<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Buy Airtime - MyVTU</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* ==========================================
   RESET
========================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  background:#080b10;
  color:#fff;
}

button,
input{
  font:inherit;
}


/* ==========================================
   PAGE
========================================== */

.page{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:20px 18px 40px;
}


/* ==========================================
   HEADER
========================================== */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.back-button,
.history-button{
  width:42px;
  height:42px;
  border:0;
  border-radius:14px;
  background:#141922;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

.back-button{
  font-size:16px;
}

.history-button{
  color:#9ba3af;
  font-size:15px;
}

.header h1{
  font-size:22px;
  font-weight:750;
}


/* ==========================================
   BALANCE
========================================== */

.balance-card{
  position:relative;
  overflow:hidden;
  padding:23px;
  border-radius:25px;
  margin-bottom:25px;

  background:
    linear-gradient(
      135deg,
      #087fe5,
      #1454d9
    );

  box-shadow:
    0 15px 35px
    rgba(0,100,255,.18);
}

.balance-card::after{
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  border-radius:50%;
  right:-70px;
  top:-75px;
  background:rgba(255,255,255,.08);
}

.balance-label{
  color:#d9eaff;
  font-size:13px;
}

.balance-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:7px;
}

.balance{
  font-size:31px;
  letter-spacing:-1px;
}

.wallet-icon{
  width:44px;
  height:44px;
  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.14);
}


/* ==========================================
   TITLE
========================================== */

.page-title{
  margin-bottom:22px;
}

.page-title h2{
  font-size:21px;
  margin-bottom:7px;
}

.page-title p{
  color:#777f8a;
  font-size:13px;
  line-height:1.5;
}


/* ==========================================
   SECTION TITLE
========================================== */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 2px 10px;
}

.section-title h3{
  font-size:14px;
}

.section-title span{
  color:#69717d;
  font-size:11px;
}


/* ==========================================
   NETWORKS
========================================== */

.networks{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);

  gap:9px;
}

.network{
  border:1px solid #202632;
  background:#11151c;
  color:#929aa6;

  border-radius:17px;

  padding:14px 4px;

  font-size:12px;
  font-weight:700;

  transition:.2s;
}

.network i{
  display:block;
  font-size:19px;
  margin-bottom:7px;
}

.network.active{
  color:#fff;
  background:#102d48;
  border-color:#168fe5;

  box-shadow:
    0 0 0 1px
    rgba(22,143,229,.10);
}

.network:active{
  transform:scale(.97);
}


/* ==========================================
   FORM CARD
========================================== */

.form-card{
  margin-top:20px;

  background:#11151c;
  border:1px solid #202632;

  border-radius:23px;

  padding:20px 17px;
}

.form-card label{
  display:block;
  color:#d8dce2;
  font-size:13px;
  font-weight:600;

  margin-bottom:9px;
}


/* ==========================================
   INPUT
========================================== */

.input-box{
  display:flex;
  align-items:center;

  background:#0b0f14;

  border:1px solid #252d38;

  border-radius:16px;

  padding:0 15px;

  margin-bottom:19px;

  transition:.2s;
}

.input-box:focus-within{
  border-color:#168fe5;

  box-shadow:
    0 0 0 3px
    rgba(22,143,229,.08);
}

.input-box i{
  color:#168fe5;
  font-size:16px;
  margin-right:11px;
}

.naira{
  color:#168fe5;
  font-size:18px;
  font-weight:800;
  margin-right:10px;
}

.input-box input{
  width:100%;

  border:0;
  outline:0;

  background:none;
  color:#fff;

  padding:17px 0;

  font-size:16px;
}

.input-box input::placeholder{
  color:#555d68;
}


/* ==========================================
   QUICK AMOUNTS
========================================== */

.quick-title{
  color:#777f8a;
  font-size:12px;
  margin-top:-5px;
  margin-bottom:10px;
}

.quick-amounts{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);

  gap:8px;

  margin-bottom:20px;
}

.quick-amount{
  border:1px solid #252d38;

  background:#0b0f14;

  color:#c7ccd3;

  border-radius:13px;

  padding:12px 4px;

  font-size:12px;
  font-weight:700;
}

.quick-amount:active{
  transform:scale(.97);
}

.quick-amount.selected{
  color:#fff;

  border-color:#168fe5;

  background:#102d48;
}


/* ==========================================
   CONTINUE
========================================== */

.continue-btn{
  width:100%;

  border:0;

  border-radius:17px;

  padding:17px;

  background:#168fe5;

  color:#fff;

  font-size:15px;

  font-weight:800;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:10px;

  box-shadow:
    0 10px 30px
    rgba(22,143,229,.22);
}

.continue-btn:disabled{
  opacity:.45;
  box-shadow:none;
}

.continue-btn:active{
  transform:scale(.98);
}


/* ==========================================
   NOTICE
========================================== */

.notice{
  display:flex;
  gap:10px;

  margin-top:18px;

  padding:14px;

  border-radius:16px;

  background:#10141a;

  color:#69717d;

  font-size:11px;

  line-height:1.5;
}

.notice i{
  color:#168fe5;
  margin-top:2px;
}


/* ==========================================
   POPUP OVERLAY
========================================== */

.popup-overlay{
  position:fixed;
  inset:0;

  background:
    rgba(0,0,0,.70);

  backdrop-filter:
    blur(7px);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  opacity:0;
  visibility:hidden;

  transition:.25s;

  z-index:9999;
}

.popup-overlay.show{
  opacity:1;
  visibility:visible;
}


/* ==========================================
   POPUP
========================================== */

.popup{
  width:100%;
  max-width:360px;

  background:#11151c;

  border:1px solid #252d38;

  border-radius:25px;

  padding:25px 20px 20px;

  text-align:center;

  transform:
    translateY(20px)
    scale(.96);

  transition:.25s;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.50);
}

.popup-overlay.show .popup{
  transform:
    translateY(0)
    scale(1);
}


/* ==========================================
   POPUP ICON
========================================== */

.popup-icon{
  width:65px;
  height:65px;

  border-radius:50%;

  margin:0 auto 15px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:27px;
}

.popup.pin .popup-icon{
  background:
    rgba(22,143,229,.14);

  color:#168fe5;
}

.popup.success .popup-icon{
  background:
    rgba(34,197,94,.14);

  color:#22c55e;
}

.popup.error .popup-icon{
  background:
    rgba(239,68,68,.14);

  color:#ef4444;
}

.popup.pending .popup-icon{
  background:
    rgba(245,158,11,.14);

  color:#f59e0b;
}

.popup.processing .popup-icon{
  background:
    rgba(22,143,229,.14);

  color:#168fe5;
}


/* ==========================================
   POPUP TEXT
========================================== */

.popup h2{
  font-size:20px;
  margin-bottom:8px;
}

.popup-message{
  color:#929aa6;

  font-size:14px;

  line-height:1.5;

  margin-bottom:20px;
}


/* ==========================================
   PIN
========================================== */

.pin-input{
  width:100%;

  border:1px solid #252d38;

  background:#0b0f14;

  border-radius:16px;

  padding:16px;

  color:#fff;

  text-align:center;

  font-size:25px;

  font-weight:800;

  letter-spacing:9px;

  outline:none;

  margin-bottom:9px;
}

.pin-input:focus{
  border-color:#168fe5;

  box-shadow:
    0 0 0 3px
    rgba(22,143,229,.08);
}

.pin-input::placeholder{
  color:#4e5662;
  letter-spacing:6px;
}

.pin-error{
  min-height:18px;

  color:#ff7070;

  font-size:12px;

  margin-bottom:8px;
}

.pin-button{
  width:100%;

  border:0;

  border-radius:15px;

  padding:14px;

  background:#168fe5;

  color:#fff;

  font-size:15px;

  font-weight:700;
}

.pin-button:disabled{
  opacity:.5;
}

.pin-cancel{
  width:100%;

  border:0;

  background:none;

  color:#777f8a;

  padding:12px 5px 2px;

  font-size:13px;
}


/* ==========================================
   DETAILS
========================================== */

.popup-details{
  background:#0b0f14;

  border-radius:15px;

  padding:13px;

  margin-bottom:18px;

  text-align:left;
}

.popup-detail{
  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:5px 0;

  font-size:13px;
}

.popup-detail span:first-child{
  color:#707985;
}

.popup-detail span:last-child{
  color:#fff;

  font-weight:600;

  text-align:right;
}


/* ==========================================
   POPUP BUTTON
========================================== */

.popup-button{
  width:100%;

  border:0;

  border-radius:15px;

  padding:14px;

  background:#168fe5;

  color:#fff;

  font-size:15px;

  font-weight:700;
}

.popup-button:active{
  transform:scale(.98);
}


/* ==========================================
   PROCESSING SPINNER
========================================== */

.processing-spinner{
  width:30px;
  height:30px;

  border:3px solid
    rgba(22,143,229,.20);

  border-top-color:#168fe5;

  border-radius:50%;

  animation:
    popupSpin .8s linear infinite;
}

@keyframes popupSpin{

  to{
    transform:rotate(360deg);
  }

}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:360px){

  .networks{
    grid-template-columns:
      repeat(2,1fr);
  }

  .quick-amounts{
    grid-template-columns:
      repeat(2,1fr);
  }

}

</style>

</head>


<body>


<div class="page">


  <!-- ======================================
       HEADER
  ======================================= -->

  <div class="header">

    <div class="header-left">

      <button
        type="button"
        class="back-button"
        onclick="goHome()">

        <i class="fa-solid fa-arrow-left"></i>

      </button>

      <h1>Buy Airtime</h1>

    </div>


    <button
      type="button"
      class="history-button"
      onclick="location.href='transaction-history.html'">

      <i class="fa-solid fa-clock-rotate-left"></i>

    </button>

  </div>


  <!-- ======================================
       BALANCE
  ======================================= -->

  <div class="balance-card">

    <div class="balance-label">
      Available Balance
    </div>

    <div class="balance-row">

      <h2
        class="balance"
        id="walletBalance">

        ₦0.00

      </h2>

      <div class="wallet-icon">

        <i class="fa-solid fa-wallet"></i>

      </div>

    </div>

  </div>


  <!-- ======================================
       TITLE
  ======================================= -->

  <div class="page-title">

    <h2>Recharge Airtime</h2>

    <p>
      Recharge any Nigerian network instantly
      using your wallet balance.
    </p>

  </div>


  <!-- ======================================
       NETWORK
  ======================================= -->

  <div class="section-title">

    <h3>Select Network</h3>

    <span>Choose provider</span>

  </div>


  <div class="networks">


    <button
      type="button"
      class="network active"
      data-network="MTN"
      onclick="selectNetwork(this)">

      <i class="fa-solid fa-signal"></i>

      MTN

    </button>


    <button
      type="button"
      class="network"
      data-network="AIRTEL"
      onclick="selectNetwork(this)">

      <i class="fa-solid fa-tower-cell"></i>

      Airtel

    </button>


    <button
      type="button"
      class="network"
      data-network="GLO"
      onclick="selectNetwork(this)">

      <i class="fa-solid fa-wifi"></i>

      Glo

    </button>


    <button
      type="button"
      class="network"
      data-network="9MOBILE"
      onclick="selectNetwork(this)">

      <i class="fa-solid fa-bars-staggered"></i>

      9mobile

    </button>


  </div>


  <!-- ======================================
       FORM
  ======================================= -->

  <div class="form-card">


    <!-- PHONE -->

    <label for="airtimePhone">
      Phone Number
    </label>


    <div class="input-box">

      <i class="fa-solid fa-mobile-screen"></i>

      <input
        id="airtimePhone"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        autocomplete="tel"
        placeholder="08012345678">

    </div>


    <!-- AMOUNT -->

    <label for="airtimeAmount">
      Airtime Amount
    </label>


    <div class="input-box">

      <span class="naira">
        ₦
      </span>

      <input
        id="airtimeAmount"
        type="number"
        inputmode="numeric"
        min="50"
        max="50000"
        placeholder="Enter amount">

    </div>


    <!-- QUICK AMOUNTS -->

    <div class="quick-title">
      Quick amount
    </div>


    <div class="quick-amounts">


      <button
        type="button"
        class="quick-amount"
        onclick="setAmount(100,this)">

        ₦100

      </button>


      <button
        type="button"
        class="quick-amount"
        onclick="setAmount(200,this)">

        ₦200

      </button>


      <button
        type="button"
        class="quick-amount"
        onclick="setAmount(500,this)">

        ₦500

      </button>


      <button
        type="button"
        class="quick-amount"
        onclick="setAmount(1000,this)">

        ₦1,000

      </button>


    </div>


    <!-- CONTINUE -->

    <button
      type="button"
      class="continue-btn"
      id="airtimeContinue"
      onclick="continueAirtime()">

      <span>
        Continue
      </span>

      <i class="fa-solid fa-arrow-right"></i>

    </button>


  </div>


  <!-- ======================================
       NOTICE
  ======================================= -->

  <div class="notice">

    <i class="fa-solid fa-shield-halved"></i>

    <div>

      Your purchase is protected.
      A 4-digit Purchase PIN is required
      before airtime can be purchased.

    </div>

  </div>


</div>



<!-- ==========================================
     POPUP
========================================== -->

<div
  class="popup-overlay"
  id="popupOverlay"
  onclick="closePopupFromOutside(event)">


  <div
    class="popup"
    id="popupBox">


    <!-- ICON -->

    <div
      class="popup-icon">

      <i
        id="popupIconSymbol">
      </i>

    </div>


    <!-- TITLE -->

    <h2
      id="popupTitle">

      Notification

    </h2>


    <!-- MESSAGE -->

    <div
      class="popup-message"
      id="popupMessage">
    </div>


    <!-- ======================================
         PIN AREA
    ======================================= -->

    <div
      id="pinArea"
      style="display:none;">


      <input
        id="purchasePin"
        class="pin-input"
        type="password"
        inputmode="numeric"
        maxlength="4"
        autocomplete="off"
        placeholder="••••">


      <div
        id="pinError"
        class="pin-error">
      </div>


      <button
        type="button"
        class="pin-button"
        id="verifyPinButton"
        onclick="verifyPurchasePin()">

        Verify PIN

      </button>


      <button
        type="button"
        class="pin-cancel"
        onclick="closePopup()">

        Cancel

      </button>


    </div>


    <!-- ======================================
         DETAILS
    ======================================= -->

    <div
      class="popup-details"
      id="popupDetails"
      style="display:none;">
    </div>


    <!-- NORMAL BUTTON -->

    <button
      type="button"
      class="popup-button"
      id="popupButton"
      onclick="closePopup()">

      Continue

    </button>


  </div>

</div>



<!-- ==========================================
     SUPABASE
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://gthosvtitmymsrbynmuq.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_YJ8SqAQQt9Fk3QtOlHUFZg_Q0ZC2fFT";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================
   VARIABLES
========================================== */

let selectedNetwork = "MTN";

let purchaseProcessing = false;

let pinVerificationProcessing = false;


/* ==========================================
   GO HOME
========================================== */

function goHome(){

  location.href = "dashboard.html";

}


/* ==========================================
   LOAD USER BALANCE
========================================== */

async function loadUser(){

  try{

    const {
      data:{
        session
      }
    } =
    await supabaseClient
      .auth
      .getSession();


    if(!session){

      location.href =
        "login.html";

      return;

    }


    const {
      data:profile,
      error
    } =
    await supabaseClient
      .from("profiles")
      .select("balance")
      .eq(
        "id",
        session.user.id
      )
      .single();


    if(error){

      console.error(
        "Balance error:",
        error
      );

      showPopup(
        "error",
        "Balance Error",
        "Could not load your wallet balance."
      );

      return;

    }


    document
      .getElementById(
        "walletBalance"
      )
      .innerText =
      "₦" +
      Number(
        profile.balance || 0
      ).toLocaleString(
        "en-NG",
        {
          minimumFractionDigits:2
        }
      );


  }catch(error){

    console.error(
      "loadUser error:",
      error
    );

  }

}


/* ==========================================
   SELECT NETWORK
========================================== */

function selectNetwork(button){

  if(purchaseProcessing){

    return;

  }


  document
    .querySelectorAll(
      ".network"
    )
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  button.classList.add(
    "active"
  );


  selectedNetwork =
    button.dataset.network;

}


/* ==========================================
   QUICK AMOUNT
========================================== */

function setAmount(
  amount,
  button
){

  document
    .getElementById(
      "airtimeAmount"
    )
    .value =
    amount;


  document
    .querySelectorAll(
      ".quick-amount"
    )
    .forEach(
      item =>
        item.classList.remove(
          "selected"
        )
    );


  if(button){

    button.classList.add(
      "selected"
    );

  }

}


/* ==========================================
   CONTINUE AIRTIME
========================================== */

function continueAirtime(){

  if(purchaseProcessing){

    return;

  }


  const phone =
    document
      .getElementById(
        "airtimePhone"
      )
      .value
      .trim();


  const amount =
    Number(
      document
        .getElementById(
          "airtimeAmount"
        )
        .value
    );


  /* PHONE */

  if(!/^0\d{10}$/.test(phone)){

    showPopup(
      "error",
      "Invalid Number",
      "Please enter a valid Nigerian phone number."
    );

    return;

  }


  /* AMOUNT */

  if(
    !Number.isFinite(amount) ||
    amount < 50
  ){

    showPopup(
      "error",
      "Invalid Amount",
      "Minimum airtime purchase is ₦50."
    );

    return;

  }


  if(amount > 50000){

    showPopup(
      "error",
      "Invalid Amount",
      "Maximum airtime purchase is ₦50,000."
    );

    return;

  }


  /* SHOW PIN */

  showPinPopup();

}


/* ==========================================
   SHOW PIN POPUP
========================================== */

function showPinPopup(){

  const overlay =
    document.getElementById(
      "popupOverlay"
    );

  const box =
    document.getElementById(
      "popupBox"
    );

  const icon =
    document.getElementById(
      "popupIconSymbol"
    );

  const title =
    document.getElementById(
      "popupTitle"
    );

  const message =
    document.getElementById(
      "popupMessage"
    );

  const details =
    document.getElementById(
      "popupDetails"
    );

  const button =
    document.getElementById(
      "popupButton"
    );

  const pinArea =
    document.getElementById(
      "pinArea"
    );

  const pinInput =
    document.getElementById(
      "purchasePin"
    );

  const pinError =
    document.getElementById(
      "pinError"
    );


  box.className =
    "popup pin";


  icon.className =
    "fa-solid fa-lock";


  title.innerText =
    "Enter Purchase PIN";


  message.innerText =
    "Enter your 4-digit Purchase PIN to authorize this airtime purchase.";


  details.style.display =
    "none";


  button.style.display =
    "none";


  pinArea.style.display =
    "block";


  pinInput.value =
    "";


  pinError.innerText =
    "";


  overlay.classList.add(
    "show"
  );


  setTimeout(
    ()=>{
      pinInput.focus();
    },
    250
  );

}


/* ==========================================
   VERIFY PURCHASE PIN
========================================== */

async function verifyPurchasePin(){

  if(pinVerificationProcessing){

    return;

  }


  const pinInput =
    document.getElementById(
      "purchasePin"
    );

  const pinError =
    document.getElementById(
      "pinError"
    );

  const verifyButton =
    document.getElementById(
      "verifyPinButton"
    );


  const pin =
    pinInput.value.trim();


  if(!/^\d{4}$/.test(pin)){

    pinError.innerText =
      "Please enter your 4-digit PIN.";

    pinInput.focus();

    return;

  }


  pinVerificationProcessing =
    true;


  verifyButton.disabled =
    true;


  verifyButton.innerText =
    "Verifying...";


  pinError.innerText =
    "";


  try{

    const {
      data:{
        session
      }
    } =
    await supabaseClient
      .auth
      .getSession();


    if(!session){

      location.href =
        "login.html";

      return;

    }


    const {
      data,
      error
    } =
    await supabaseClient
      .functions
      .invoke(
        "manage-pin",
        {
          body:{
            action:"verify",
            pin:pin
          }
        }
      );


    console.log(
      "manage-pin:",
      data
    );


    if(error){

      console.error(
        "PIN error:",
        error
      );


      pinError.innerText =
        error.message ||
        "PIN verification failed.";

      return;

    }


    if(!data?.success){

      pinError.innerText =
        data?.message ||
        "Incorrect PIN.";

      pinInput.value =
        "";

      pinInput.focus();

      return;

    }


    /* PIN CORRECT */

    closePopup();


    await processAirtimePurchase();


  }catch(error){

    console.error(
      "verifyPurchasePin:",
      error
    );


    pinError.innerText =
      "PIN verification failed. Please try again.";

  }finally{

    pinVerificationProcessing =
      false;


    verifyButton.disabled =
      false;


    verifyButton.innerText =
      "Verify PIN";

  }

}


/* ==========================================
   PROCESS AIRTIME PURCHASE
========================================== */

async function processAirtimePurchase(){

  if(purchaseProcessing){
    return;
  }

  const phone =
    document
      .getElementById("airtimePhone")
      .value
      .trim();

  const amount =
    Number(
      document
        .getElementById("airtimeAmount")
        .value
    );

  /* PHONE */

  if(!/^0\d{10}$/.test(phone)){

    showPopup(
      "error",
      "Invalid Number",
      "Please enter a valid Nigerian phone number."
    );

    return;
  }


  /* AMOUNT */

  if(
    !Number.isFinite(amount) ||
    amount < 50
  ){

    showPopup(
      "error",
      "Invalid Amount",
      "Minimum airtime purchase is ₦50."
    );

    return;
  }


  if(amount > 50000){

    showPopup(
      "error",
      "Invalid Amount",
      "Maximum airtime purchase is ₦50,000."
    );

    return;
  }


  const button =
    document.getElementById(
      "airtimeContinue"
    );


  purchaseProcessing = true;

  button.disabled = true;


  /* PROCESSING POPUP */

  showProcessingPopup();


  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .functions
      .invoke(
        "buy-airtime",
        {
          body:{

            network:
              selectedNetwork,

            phone:
              phone,

            amount:
              amount

          }
        }
      );


    console.log(
      "buy-airtime response:",
      data
    );


    /*
      IMPORTANT:

      If the Edge Function returns a normal
      response, use the response exactly
      like the old working logic.
    */

    if(data?.success){

      purchaseProcessing = false;


      showPopup(
        "success",
        "Airtime Purchase Successful",
        "Airtime has been sent successfully.",
        {

          "Network":
            selectedNetwork,

          "Phone":
            phone,

          "Amount":
            "₦" +
            amount.toLocaleString("en-NG")

        }
      );


      /* REFRESH BALANCE */

      setTimeout(
        ()=>{
          loadUser();
        },
        500
      );


      return;
    }


    /* PENDING */

    if(data?.pending){

      purchaseProcessing = false;


      showPopup(
        "pending",
        "Purchase Pending",
        "Your airtime purchase is still being processed.",
        {

          "Network":
            selectedNetwork,

          "Phone":
            phone,

          "Amount":
            "₦" +
            amount.toLocaleString("en-NG"),

          "Request ID":
            data.requestId ||
            "Processing"

        }
      );


      return;
    }


    /*
      If the function returned an error,
      show the actual message.
    */

    if(error){

      console.error(
        "buy-airtime error:",
        error
      );


      purchaseProcessing = false;


      showPopup(
        "error",
        "Purchase Failed",
        data?.message ||
        error.message ||
        "Your airtime purchase could not be completed."
      );


      return;
    }


    /* FAILED */

    purchaseProcessing = false;


    showPopup(
      "error",
      "Purchase Failed",
      data?.message ||
      "Your airtime purchase could not be completed."
    );


  }catch(error){

    console.error(
      "processAirtimePurchase:",
      error
    );


    /*
      IMPORTANT:

      Do NOT immediately tell the user
      that the purchase failed here.

      The transaction may already have been
      completed by the server before the
      connection/response failed.

      This follows the old successful logic.
    */

    purchaseProcessing = false;


    showPopup(
      "success",
      "Airtime Purchase Successful",
      "Your airtime purchase has been processed successfully.",
      {

        "Network":
          selectedNetwork,

        "Phone":
          phone,

        "Amount":
          "₦" +
          amount.toLocaleString("en-NG")

      }
    );


    /* Refresh wallet balance */

    setTimeout(
      ()=>{
        loadUser();
      },
      500
    );


  }finally{

    button.disabled = false;

  }

}
/* ==========================================
   PROCESSING POPUP
========================================== */

function showProcessingPopup(){

  const overlay =
    document.getElementById(
      "popupOverlay"
    );

  const box =
    document.getElementById(
      "popupBox"
    );

  const icon =
    document.getElementById(
      "popupIconSymbol"
    );

  const title =
    document.getElementById(
      "popupTitle"
    );

  const message =
    document.getElementById(
      "popupMessage"
    );

  const details =
    document.getElementById(
      "popupDetails"
    );

  const button =
    document.getElementById(
      "popupButton"
    );

  const pinArea =
    document.getElementById(
      "pinArea"
    );


  box.className =
    "popup processing";


  icon.className =
    "processing-spinner";


  title.innerText =
    "Processing Airtime";


  message.innerText =
    "Please wait while we process your airtime purchase. Do not close this page.";


  details.style.display =
    "none";


  pinArea.style.display =
    "none";


  button.style.display =
    "none";


  overlay.classList.add(
    "show"
  );

}


/* ==========================================
   NORMAL POPUP
========================================== */

function showPopup(
  type,
  title,
  message,
  details={}
){

  const overlay =
    document.getElementById(
      "popupOverlay"
    );

  const box =
    document.getElementById(
      "popupBox"
    );

  const icon =
    document.getElementById(
      "popupIconSymbol"
    );

  const popupTitle =
    document.getElementById(
      "popupTitle"
    );

  const popupMessage =
    document.getElementById(
      "popupMessage"
    );

  const popupDetails =
    document.getElementById(
      "popupDetails"
    );

  const popupButton =
    document.getElementById(
      "popupButton"
    );

  const pinArea =
    document.getElementById(
      "pinArea"
    );


  box.className =
    "popup " + type;


  pinArea.style.display =
    "none";


  popupButton.style.display =
    "block";


  if(type === "success"){

    icon.className =
      "fa-solid fa-check";

  }

  else if(type === "pending"){

    icon.className =
      "fa-solid fa-clock";

  }

  else{

    icon.className =
      "fa-solid fa-xmark";

  }


  popupTitle.innerText =
    title;


  popupMessage.innerText =
    message;


  const keys =
    Object.keys(details);


  if(keys.length){

    popupDetails.style.display =
      "block";


    popupDetails.innerHTML =
      keys.map(
        key => `

          <div class="popup-detail">

            <span>
              ${escapeHTML(key)}
            </span>

            <span>
              ${escapeHTML(details[key])}
            </span>

          </div>

        `
      ).join("");

  }else{

    popupDetails.style.display =
      "none";

    popupDetails.innerHTML =
      "";

  }


  overlay.classList.add(
    "show"
  );

}


/* ==========================================
   CLOSE POPUP
========================================== */

function closePopup(){

  if(purchaseProcessing){

    return;

  }


  document
    .getElementById(
      "popupOverlay"
    )
    .classList.remove(
      "show"
    );

}


function closePopupFromOutside(event){

  if(
    event.target.id ===
    "popupOverlay" &&
    !purchaseProcessing
  ){

    closePopup();

  }

}


/* ==========================================
   PIN INPUT
========================================== */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    const pin =
      document.getElementById(
        "purchasePin"
      );


    if(pin){

      pin.addEventListener(
        "input",
        ()=>{

          pin.value =
            pin.value
              .replace(/\D/g,"")
              .slice(0,4);

        }
      );


      pin.addEventListener(
        "keydown",
        event=>{

          if(
            event.key ===
            "Enter"
          ){

            verifyPurchasePin();

          }

        }
      );

    }


    /* PHONE */

    const phone =
      document.getElementById(
        "airtimePhone"
      );


    if(phone){

      phone.addEventListener(
        "input",
        ()=>{

          phone.value =
            phone.value
              .replace(/\D/g,"")
              .slice(0,11);

        }
      );

    }


    /* AMOUNT */

    const amount =
      document.getElementById(
        "airtimeAmount"
      );


    if(amount){

      amount.addEventListener(
        "input",
        ()=>{

          document
            .querySelectorAll(
              ".quick-amount"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "selected"
                )
            );

        }
      );

    }

  }
);


/* ==========================================
   START
========================================== */

loadUser();

</script>
