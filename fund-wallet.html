<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fund Wallet - MyVTU</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #0d0d0d;
      color: white;
    }

    .page {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 25px 20px 40px;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 30px;
    }

    .back {
      width: 45px;
      height: 45px;
      border-radius: 15px;
      border: none;
      background: #171717;
      color: white;
      font-size: 18px;
    }

    .top h1 {
      font-size: 25px;
    }

    .balance-card {
      background: linear-gradient(145deg, #1688db, #218ed8);
      border-radius: 28px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .balance-card p {
      color: #d9efff;
      margin-bottom: 8px;
    }

    .balance-card h2 {
      font-size: 35px;
    }

    .label {
      display: block;
      color: #aaa;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .amount-box {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 5px 18px;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .amount-box span {
      font-size: 22px;
      color: #168fe5;
      font-weight: 600;
    }

    .amount-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 25px;
      padding: 17px 10px;
    }

    .quick-title {
      color: #aaa;
      margin-bottom: 12px;
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .quick button {
      background: #171717;
      border: 1px solid #292929;
      color: white;
      border-radius: 15px;
      padding: 13px 5px;
      font-weight: 600;
    }

    .quick button:active {
      background: #1688db;
    }

    .continue {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 20px;
      background: #168fe5;
      color: white;
      font-size: 17px;
      font-weight: 700;
    }

    .continue:disabled {
      opacity: .5;
    }

    .message {
      display: none;
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      background: #171717;
      border: 1px solid #292929;
    }

    .message.show {
      display: block;
    }

    .message.error {
      border-color: #7d3030;
      color: #ff8e8e;
    }

    .message.success {
      border-color: #28734a;
      color: #7ee2a8;
    }

    .message.info {
      border-color: #245b7d;
      color: #83caff;
    }

    .notice {
      margin-top: 20px;
      padding: 16px;
      background: #151515;
      border-radius: 18px;
      color: #999;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="page">

  <div class="top">

    <button
      type="button"
      class="back"
      onclick="history.back()">

      <i class="fa-solid fa-arrow-left"></i>

    </button>

    <h1>Fund Wallet</h1>

  </div>


  <div class="balance-card">

    <p>Current Balance</p>

    <h2 id="currentBalance">
      ₦0.00
    </h2>

  </div>


  <div
    id="message"
    class="message">
  </div>


  <label class="label">
    Enter amount
  </label>


  <div class="amount-box">

    <span>₦</span>

    <input
      id="amount"
      type="number"
      inputmode="numeric"
      placeholder="0"
      min="100"
    >

  </div>


  <p class="quick-title">
    Quick amount
  </p>


  <div class="quick">

    <button
      type="button"
      onclick="setAmount(500)">
      ₦500
    </button>

    <button
      type="button"
      onclick="setAmount(1000)">
      ₦1,000
    </button>

    <button
      type="button"
      onclick="setAmount(5000)">
      ₦5,000
    </button>

    <button
      type="button"
      onclick="setAmount(10000)">
      ₦10,000
    </button>

  </div>


  <button
    type="button"
    class="continue"
    onclick="continuePayment()">

    Continue to Payment

  </button>


  <div class="notice">

    <i class="fa-solid fa-shield-halved"></i>

    Your payment will be processed securely through our
    payment provider. Your wallet is credited only after
    the payment is confirmed.

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://gthosvtitmymsrbynmuq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YJ8SqAQQt9Fk3QtOlHUFZg_Q0ZC2fFT";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ===============================
// MESSAGE
// ===============================

function showMessage(text, type) {

  const box =
    document.getElementById("message");

  box.innerText = text;

  box.className =
    "message show " + (type || "info");

}


function clearMessage() {

  const box =
    document.getElementById("message");

  box.innerText = "";

  box.className = "message";

}


// ===============================
// FORMAT MONEY
// ===============================

function formatMoney(amount) {

  return "₦" +
    Number(amount || 0).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

}


// ===============================
// LOAD BALANCE
// ===============================

async function loadBalance() {

  try {

    const {
      data: {
        session
      },
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (
      sessionError ||
      !session
    ) {

      showMessage(
        "Please log in again.",
        "error"
      );

      return;

    }


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("balance")
        .eq(
          "id",
          session.user.id
        )
        .single();


    if (
      profileError ||
      !profile
    ) {

      console.error(
        "Balance error:",
        profileError
      );

      showMessage(
        "Unable to load your wallet balance.",
        "error"
      );

      return;

    }


    document
      .getElementById("currentBalance")
      .innerText =
      formatMoney(profile.balance);

  } catch (error) {

    console.error(
      "Load balance error:",
      error
    );

    showMessage(
      "Unable to load your wallet balance.",
      "error"
    );

  }

}


// ===============================
// QUICK AMOUNT
// ===============================

function setAmount(amount) {

  document
    .getElementById("amount")
    .value = amount;

  clearMessage();

}


// ===============================
// CREATE PAYMENT
// ===============================

async function continuePayment() {

  clearMessage();


  const amount =
    Number(
      document
        .getElementById("amount")
        .value
    );


  if (
    !Number.isFinite(amount) ||
    amount < 100
  ) {

    showMessage(
      "Enter an amount of at least ₦100.",
      "error"
    );

    return;

  }


  if (amount > 1000000) {

    showMessage(
      "Maximum funding amount is ₦1,000,000.",
      "error"
    );

    return;

  }


  const button =
    document.querySelector(
      ".continue"
    );


  button.disabled = true;

  button.innerText =
    "Creating payment...";


  try {

    const {
      data: {
        session
      },
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (
      sessionError ||
      !session
    ) {

      showMessage(
        "Please log in again.",
        "error"
      );

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient.functions.invoke(
        "create-wallet-invoice",
        {
          body: {
            amount: amount
          }
        }
      );


    if (error) {

      console.error(
        "Edge Function error:",
        error
      );

      showMessage(
        "Could not connect to the payment service.",
        "error"
      );

      return;

    }


    if (
      !data ||
      !data.success
    ) {

      showMessage(
        data?.message ||
        "Could not create payment.",
        "error"
      );

      return;

    }


    if (!data.checkoutUrl) {

      showMessage(
        "Payment page was not returned.",
        "error"
      );

      return;

    }


    showMessage(
      "Payment created. Opening secure checkout...",
      "success"
    );


    setTimeout(
      function() {

        window.location.href =
          data.checkoutUrl;

      },
      500
    );


  } catch (error) {

    console.error(
      "Payment error:",
      error
    );

    showMessage(
      "Something went wrong. Please try again.",
      "error"
    );

  } finally {

    button.disabled = false;

    button.innerText =
      "Continue to Payment";

  }

}


// ===============================
// START
// ===============================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadBalance();

  }
);

</script>

</body>
</html>
