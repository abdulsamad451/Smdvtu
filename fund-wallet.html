<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fund Wallet - SMDVTU</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #0d0d0d;
      color: white;
    }

    .page {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 25px 20px 40px;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 30px;
    }

    .back {
      width: 45px;
      height: 45px;
      border-radius: 15px;
      border: none;
      background: #171717;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .top h1 {
      font-size: 25px;
    }

    .balance-card {
      background: linear-gradient(145deg, #1688db, #218ed8);
      border-radius: 28px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .balance-card p {
      color: #d9efff;
      margin-bottom: 8px;
    }

    .balance-card h2 {
      font-size: 35px;
    }

    .label {
      display: block;
      color: #aaa;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .amount-box {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 5px 18px;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .amount-box span {
      font-size: 22px;
      color: #168fe5;
      font-weight: 600;
    }

    .amount-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 25px;
      padding: 17px 10px;
    }

    .quick-title {
      color: #aaa;
      margin-bottom: 12px;
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .quick button {
      background: #171717;
      border: 1px solid #292929;
      color: white;
      border-radius: 15px;
      padding: 13px 5px;
      font-weight: 600;
      cursor: pointer;
    }

    .quick button:active {
      background: #1688db;
    }

    .continue {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 20px;
      background: #168fe5;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .continue:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      background: #171717;
      border: 1px solid #292929;
    }

    .message.show {
      display: block;
    }

    .message.error {
      border-color: #7d3030;
      color: #ff8e8e;
    }

    .message.success {
      border-color: #28734a;
      color: #7ee2a8;
    }

    .message.info {
      border-color: #245b7d;
      color: #83caff;
    }

    .notice {
      margin-top: 20px;
      padding: 16px;
      background: #151515;
      border-radius: 18px;
      color: #999;
      font-size: 13px;
      line-height: 1.5;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

  </style>
</head>

<body>

<div class="page">

  <!-- HEADER -->

  <div class="top">

    <button
      type="button"
      class="back"
      onclick="history.back()">

      <i class="fa-solid fa-arrow-left"></i>

    </button>

    <h1>Fund Wallet</h1>

  </div>


  <!-- BALANCE -->

  <div class="balance-card">

    <p>Current Balance</p>

    <h2 id="currentBalance">
      ₦0.00
    </h2>

  </div>


  <!-- MESSAGE -->

  <div
    id="message"
    class="message">
  </div>


  <!-- AMOUNT -->

  <label class="label">
    Enter amount
  </label>


  <div class="amount-box">

    <span>₦</span>

    <input
      id="amount"
      type="number"
      inputmode="numeric"
      placeholder="0"
      min="100"
      max="1000000"
    >

  </div>


  <!-- QUICK AMOUNTS -->

  <p class="quick-title">
    Quick amount
  </p>


  <div class="quick">

    <button
      type="button"
      onclick="setAmount(500)">
      ₦500
    </button>

    <button
      type="button"
      onclick="setAmount(1000)">
      ₦1,000
    </button>

    <button
      type="button"
      onclick="setAmount(5000)">
      ₦5,000
    </button>

    <button
      type="button"
      onclick="setAmount(10000)">
      ₦10,000
    </button>

  </div>


  <!-- CONTINUE -->

  <button
    type="button"
    class="continue"
    id="continueButton"
    onclick="continuePayment()">

    Continue to Payment

  </button>


  <!-- NOTICE -->

  <div class="notice">

    <i class="fa-solid fa-shield-halved"></i>

    Your payment will be processed securely through
    Paystack. Your wallet will only be credited after
    the payment has been successfully confirmed.

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
  "https://gthosvtitmymsrbynmuq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YJ8SqAQQt9Fk3QtOlHUFZg_Q0ZC2fFT";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ==========================================
// MESSAGE
// ==========================================

function showMessage(text, type) {

  const box =
    document.getElementById(
      "message"
    );

  box.innerText =
    text;

  box.className =
    "message show " +
    (type || "info");

}


function clearMessage() {

  const box =
    document.getElementById(
      "message"
    );

  box.innerText =
    "";

  box.className =
    "message";

}


// ==========================================
// FORMAT MONEY
// ==========================================

function formatMoney(amount) {

  return "₦" +
    Number(
      amount || 0
    ).toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

}


// ==========================================
// LOAD BALANCE
// ==========================================

async function loadBalance() {

  try {

    const {
      data: {
        session
      },
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (
      sessionError ||
      !session
    ) {

      showMessage(
        "Please log in again.",
        "error"
      );

      return;

    }


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("balance")
        .eq(
          "id",
          session.user.id
        )
        .single();


    if (
      profileError ||
      !profile
    ) {

      console.error(
        "Balance error:",
        profileError
      );

      showMessage(
        "Unable to load your wallet balance.",
        "error"
      );

      return;

    }


    document
      .getElementById(
        "currentBalance"
      )
      .innerText =
      formatMoney(
        profile.balance
      );

  } catch (error) {

    console.error(
      "Load balance error:",
      error
    );

    showMessage(
      "Unable to load your wallet balance.",
      "error"
    );

  }

}


// ==========================================
// QUICK AMOUNT
// ==========================================

function setAmount(amount) {

  document
    .getElementById(
      "amount"
    )
    .value =
    amount;

  clearMessage();

}


// ==========================================
// CONTINUE PAYMENT
// ==========================================

async function continuePayment() {

  clearMessage();


  const amount =
    Number(
      document
        .getElementById(
          "amount"
        )
        .value
    );


  // ========================================
  // VALIDATE AMOUNT
  // ========================================

  if (
    !Number.isFinite(amount) ||
    amount < 100
  ) {

    showMessage(
      "Enter an amount of at least ₦100.",
      "error"
    );

    return;

  }


  if (
    amount > 1000000
  ) {

    showMessage(
      "Maximum funding amount is ₦1,000,000.",
      "error"
    );

    return;

  }


  // ========================================
  // BUTTON
  // ========================================

  const button =
    document.getElementById(
      "continueButton"
    );


  button.disabled =
    true;


  button.innerHTML =
    '<span class="loading"></span>Creating payment...';


  try {

    // ======================================
    // GET SESSION
    // ======================================

    const {
      data: {
        session
      },
      error: sessionError
    } =
      await supabaseClient.auth.getSession();


    if (
      sessionError ||
      !session
    ) {

      showMessage(
        "Your login session has expired. Please log in again.",
        "error"
      );

      return;

    }


    // ======================================
    // CALL PAYSTACK EDGE FUNCTION
    // ======================================

    console.log(
      "Creating Paystack payment..."
    );

    console.log(
      "Amount:",
      amount
    );


    const {
      data,
      error
    } =
      await supabaseClient.functions.invoke(
        "create-wallet-payment",
        {
          body: {
            amount:
              amount
          }
        }
      );


    console.log(
      "Paystack function response:",
      data
    );


    // ======================================
    // EDGE FUNCTION ERROR
    // ======================================

    if (error) {

      console.error(
        "Edge Function error:",
        error
      );

      showMessage(
        "Could not connect to the payment service. Please try again.",
        "error"
      );

      return;

    }


    // ======================================
    // PAYMENT CREATION FAILED
    // ======================================

    if (
      !data ||
      !data.success
    ) {

      console.error(
        "Payment creation failed:",
        data
      );

      showMessage(
        data?.message ||
        "Could not create Paystack payment.",
        "error"
      );

      return;

    }


    // ======================================
    // CHECKOUT URL
    // ======================================

    if (
      !data.checkoutUrl
    ) {

      console.error(
        "No checkout URL:",
        data
      );

      showMessage(
        "Paystack did not return a payment page.",
        "error"
      );

      return;

    }


    // ======================================
    // SUCCESS
    // ======================================

    showMessage(
      "Payment created successfully. Opening Paystack...",
      "success"
    );


    console.log(
      "Opening Paystack:",
      data.checkoutUrl
    );


    // ======================================
    // OPEN PAYSTACK
    // ======================================

    setTimeout(
      function() {

        window.location.href =
          data.checkoutUrl;

      },
      500
    );


  } catch (error) {

    console.error(
      "Payment error:",
      error
    );

    showMessage(
      error?.message ||
      "Something went wrong. Please try again.",
      "error"
    );

  } finally {

    button.disabled =
      false;

    button.innerHTML =
      "Continue to Payment";

  }

}


// ==========================================
// START
// ==========================================

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadBalance();

  }
);

</script>

</body>
</html>
