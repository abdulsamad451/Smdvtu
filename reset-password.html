<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password - MyVTU</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="auth.css">

  <style>
    .input-box {
      position: relative;
    }

    .show-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 16px;
    }

    .input-box input {
      padding-right: 45px;
    }

    .back-login {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #168fe5;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="auth-page">

  <div class="brand">

    <div class="brand-icon">
      <i class="fa-solid fa-wallet"></i>
    </div>

    <h1>MyVTU</h1>

    <p>Power your everyday payments</p>

  </div>

  <div class="auth-card">

    <h2>Reset Password</h2>

    <p class="subtitle">
      Create a new password for your account.
    </p>

    <form id="resetPasswordForm">

      <label>New Password</label>

      <div class="input-box">

        <i class="fa-solid fa-lock"></i>

        <input
          type="password"
          id="newPassword"
          placeholder="Enter new password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword('newPassword', this)">

          <i class="fa-regular fa-eye"></i>

        </button>

      </div>


      <label>Confirm Password</label>

      <div class="input-box">

        <i class="fa-solid fa-lock"></i>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="show-password"
          onclick="togglePassword('confirmPassword', this)">

          <i class="fa-regular fa-eye"></i>

        </button>

      </div>


      <div
        id="resetMessage"
        class="message"
        style="display:none;">
      </div>


      <button
        type="submit"
        class="auth-button"
        id="resetButton">

        Change Password

        <i class="fa-solid fa-check"></i>

      </button>

    </form>

    <a
      href="login.html"
      class="back-login">

      Back to Login

    </a>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://gthosvtitmymsrbynmuq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_YJ8SqAQQt9Fk3QtOlHUFZg_Q0ZC2fFT";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


function togglePassword(
  inputId,
  button
) {

  const input =
    document.getElementById(inputId);

  if (
    input.type === "password"
  ) {

    input.type = "text";

    button.innerHTML =
      '<i class="fa-regular fa-eye-slash"></i>';

  } else {

    input.type = "password";

    button.innerHTML =
      '<i class="fa-regular fa-eye"></i>';

  }

}


const form =
  document.getElementById(
    "resetPasswordForm"
  );

const message =
  document.getElementById(
    "resetMessage"
  );

const button =
  document.getElementById(
    "resetButton"
  );


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const password =
      document
        .getElementById("newPassword")
        .value;

    const confirmPassword =
      document
        .getElementById("confirmPassword")
        .value;


    if (password.length < 6) {

      message.style.display = "block";

      message.className =
        "message";

      message.innerText =
        "Password must contain at least 6 characters.";

      return;

    }


    if (
      password !==
      confirmPassword
    ) {

      message.style.display = "block";

      message.className =
        "message";

      message.innerText =
        "Passwords do not match.";

      return;

    }


    button.disabled = true;

    message.style.display = "block";

    message.className =
      "message success";

    message.innerText =
      "Updating your password...";


    try {

      const {
        error
      } =
      await supabaseClient.auth
        .updateUser({
          password: password
        });


      if (error) {

        console.error(
          "Update password error:",
          error
        );

        message.className =
          "message";

        message.innerText =
          error.message;

        return;

      }


      message.className =
        "message success";

      message.innerText =
        "Your password has been changed successfully. Redirecting to login...";


      setTimeout(
        function() {

          window.location.href =
            "login.html";

        },
        2000
      );


    } catch (error) {

      console.error(
        "Reset password error:",
        error
      );

      message.className =
        "message";

      message.innerText =
        "Something went wrong. Please try again.";

    } finally {

      button.disabled = false;

    }

  }
);

</script>

</body>
</html>
