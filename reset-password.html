<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - MyVTU</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
  <link rel="stylesheet" href="auth.css">
  <style>
    .input-box {
      position: relative;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 16px;
      padding: 5px;
    }

    .input-box input {
      padding-right: 45px;
    }

    .back-login {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #168fe5;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .message {
      margin: 15px 0;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.success {
      color: #7ee2a8;
      background: #151515;
      border: 1px solid #28734a;
    }

    .message.error {
      color: #ff8585;
      background: #1a1010;
      border: 1px solid #733333;
    }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="brand">
<div class="brand-icon">
  <i class="fa-solid fa-wallet"></i>
</div>

<h1>MyVTU</h1>

<p>Power your everyday payments</p>
  </div>
  <div class="auth-card">
<h2>Reset Password</h2>

<p class="subtitle">
  Create a new password for your account.
</p>


<div
  id="resetMessage"
  class="message"
  style="display:none;">
</div>


<form
  id="resetPasswordForm"
  style="display:none;">

  <label>New Password</label>

  <div class="input-box">

    <i class="fa-solid fa-lock"></i>

    <input
      type="password"
      id="newPassword"
      placeholder="Enter new password"
      minlength="6"
      required
    >

    <button
      type="button"
      class="show-password"
      onclick="togglePassword('newPassword', this)">

      <i class="fa-regular fa-eye"></i>

    </button>

  </div>


  <label>Confirm Password</label>

  <div class="input-box">

    <i class="fa-solid fa-lock"></i>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm new password"
      minlength="6"
      required
    >

    <button
      type="button"
      class="show-password"
      onclick="togglePassword('confirmPassword', this)">

      <i class="fa-regular fa-eye"></i>

    </button>

  </div>


  <button
    type="submit"
    class="auth-button"
    id="resetButton">

    Change Password

    <i class="fa-solid fa-check"></i>

  </button>

</form>


<a
  href="login.html"
  class="back-login">

  <i class="fa-solid fa-arrow-left"></i>
  Back to Login

</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPABASE_URL =
  "https://gthosvtitmymsrbynmuq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_YJ8SqAQQt9Fk3QtOlHUFZg_Q0ZC2fFT";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const form =
  document.getElementById(
    "resetPasswordForm"
  );


const message =
  document.getElementById(
    "resetMessage"
  );


const button =
  document.getElementById(
    "resetButton"
  );


function showMessage(
  text,
  type = "error"
) {

  message.style.display = "block";

  message.className =
    "message " + type;

  message.innerText =
    text;

}


function togglePassword(
  inputId,
  button
) {

  const input =
    document.getElementById(
      inputId
    );


  if (
    input.type === "password"
  ) {

    input.type = "text";

    button.innerHTML =
      '<i class="fa-regular fa-eye-slash"></i>';

  } else {

    input.type = "password";

    button.innerHTML =
      '<i class="fa-regular fa-eye"></i>';

  }

}


/*
  Check the recovery link/session
*/

async function checkRecoverySession() {

  try {

    /*
      Supabase v2 automatically detects
      the recovery session from the URL.
    */

    const {
      data,
      error
    } =
    await supabaseClient.auth
      .getSession();


    if (error) {

      console.error(
        "Session error:",
        error
      );

      showMessage(
        "This password reset link is invalid or has expired. Please request a new one."
      );

      return;

    }


    if (
      data &&
      data.session
    ) {

      /*
        A valid recovery session exists.
        Show the password form.
      */

      message.style.display =
        "none";

      form.style.display =
        "block";

      return;

    }


    /*
      Check URL for an auth error.
    */

    const hash =
      window.location.hash;


    if (
      hash.includes(
        "error="
      )
    ) {

      showMessage(
        "This password reset link is invalid or has expired. Please request a new reset link."
      );

      return;

    }


    /*
      No session and no explicit error.
    */

    showMessage(
      "Please open the password reset link from your email."
    );

  } catch (error) {

    console.error(
      "Recovery session error:",
      error
    );

    showMessage(
      "Unable to verify the reset link. Please request a new password reset email."
    );

  }

}


/*
  Change password
*/

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const password =
      document
        .getElementById(
          "newPassword"
        )
        .value;


    const confirmPassword =
      document
        .getElementById(
          "confirmPassword"
        )
        .value;


    if (
      password.length < 6
    ) {

      showMessage(
        "Password must contain at least 6 characters."
      );

      return;

    }


    if (
      password !==
      confirmPassword
    ) {

      showMessage(
        "Passwords do not match."
      );

      return;

    }


    button.disabled =
      true;


    button.innerHTML =
      "Updating password...";


    showMessage(
      "Updating your password...",
      "success"
    );


    try {

      const {
        error
      } =
      await supabaseClient.auth
        .updateUser({
          password:
            password
        });


      if (error) {

        console.error(
          "Update password error:",
          error
        );

        showMessage(
          error.message
        );

        button.disabled =
          false;

        button.innerHTML =
          'Change Password <i class="fa-solid fa-check"></i>';

        return;

      }


      showMessage(
        "Your password has been changed successfully. Redirecting to login...",
        "success"
      );


      /*
        Sign out the recovery session
        before returning to login.
      */

      await supabaseClient.auth
        .signOut();


      setTimeout(
        function() {

          window.location.href =
            "login.html";

        },
        2000
      );


    } catch (error) {

      console.error(
        "Password reset error:",
        error
      );

      showMessage(
        "Something went wrong. Please try again."
      );


      button.disabled =
        false;

      button.innerHTML =
        'Change Password <i class="fa-solid fa-check"></i>';

    }

  }
);


/*
  Listen for Supabase authentication
  events, including PASSWORD_RECOVERY.
*/

supabaseClient.auth.onAuthStateChange(
  async function(
    event,
    session
  ) {

    console.log(
      "Auth event:",
      event
    );


    if (
      event ===
      "PASSWORD_RECOVERY"
    ) {

      message.style.display =
        "none";

      form.style.display =
        "block";

    }

  }
);


/*
  Start checking the recovery session.
*/

checkRecoverySession();

</script>
</body>

</html>
