<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Apply theme before page renders -->
<script>
(function () {
  const theme =
    localStorage.getItem("myvtu_theme") || "system";

  const isDark =
    theme === "dark" ||
    (
      theme === "system" &&
      window.matchMedia("(prefers-color-scheme: dark)").matches
    );

  document.documentElement.classList.toggle("dark-theme", isDark);
  document.documentElement.classList.toggle("light-theme", !isDark);
})();
</script>

<title>More - MyVTU</title>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

:root{
  color-scheme:dark;

  --bg:#080b10;
  --text:#fff;
  --muted:#707985;
  --muted2:#626a76;

  --header-button:#141922;

  --card:#11151c;
  --card-border:#202632;
  --item:#11151c;
  --item-active:#171d26;

  --icon-bg:#19212c;
  --icon:#168fe5;

  --arrow:#555e6b;

  --nav-bg:rgba(8,11,16,.96);
  --nav-border:#1b2029;

  --loader-bg:#080b10;
  --loader-border:#252d38;

  --popup:#11151c;
  --input:#080b10;
  --input-border:#29313d;

  --cancel:#1b2029;
  --cancel-text:#aab1bc;
}


/* ==========================================
   LIGHT THEME
========================================== */

html.light-theme{
  color-scheme:light;

  --bg:#f5f7fa;
  --text:#111318;
  --muted:#66707d;
  --muted2:#68717e;

  --header-button:#fff;

  --card:#fff;
  --card-border:#e3e7ed;
  --item:#fff;
  --item-active:#f1f4f8;

  --icon-bg:#edf5fc;
  --icon:#168fe5;

  --arrow:#8a929e;

  --nav-bg:rgba(255,255,255,.96);
  --nav-border:#e1e5eb;

  --loader-bg:#f5f7fa;
  --loader-border:#dce1e8;

  --popup:#fff;
  --input:#f7f9fb;
  --input-border:#dce2e9;

  --cancel:#eef1f5;
  --cancel-text:#59616d;
}


html,
body{
  min-height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  transition:
    background .2s ease,
    color .2s ease;
}

.page{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:20px 18px 110px;
}


/* ==========================================
   HEADER
========================================== */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.back{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:var(--header-button);
  color:var(--text);
  font-size:17px;
  cursor:pointer;
}

.back:active{
  transform:scale(.94);
}

.header h1{
  font-size:23px;
  font-weight:750;
}

.header-subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}


/* ==========================================
   PROFILE CARD
========================================== */

.profile-card{
  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;

  padding:20px;

  border-radius:24px;

  margin-bottom:25px;

  background:
    linear-gradient(
      135deg,
      #087fe5,
      #1454d9
    );

  box-shadow:
    0 15px 35px
    rgba(0,100,255,.18);
}

.profile-card:after{
  content:"";

  position:absolute;

  width:150px;
  height:150px;

  border-radius:50%;

  right:-65px;
  top:-70px;

  background:
    rgba(255,255,255,.08);
}

.profile-avatar{
  width:54px;
  height:54px;

  border-radius:17px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    rgba(255,255,255,.16);

  font-size:21px;

  margin-right:14px;

  position:relative;
  z-index:1;
}

.profile-info{
  position:relative;
  z-index:1;
}

.profile-info h2{
  font-size:17px;
  margin-bottom:4px;
}

.profile-info p{
  color:#d9eaff;
  font-size:12px;
}


/* ==========================================
   SECTION
========================================== */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin:
    25px
    2px
    11px;
}

.section-title h3{
  font-size:14px;
  font-weight:700;
}

.section-title span{
  color:var(--muted2);
  font-size:11px;
}


/* ==========================================
   MENU
========================================== */

.menu{
  display:flex;
  flex-direction:column;

  background:var(--card);

  border:
    1px solid
    var(--card-border);

  border-radius:22px;

  overflow:hidden;
}


/* ==========================================
   MENU ITEM
========================================== */

.more-item{
  width:100%;

  display:flex;
  align-items:center;

  padding:16px;

  background:var(--item);

  border:none;

  color:var(--text);

  text-align:left;

  cursor:pointer;

  transition:
    background .2s,
    transform .15s;
}

.more-item:not(:last-child){
  border-bottom:
    1px solid
    var(--card-border);
}

.more-item:active{
  background:var(--item-active);
  transform:scale(.99);
}


/* ==========================================
   ICON
========================================== */

.more-icon{
  width:45px;
  height:45px;

  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--icon-bg);

  color:var(--icon);

  font-size:17px;

  flex-shrink:0;

  margin-right:13px;
}


/* ==========================================
   TEXT
========================================== */

.more-text{
  flex:1;
}

.more-text h3{
  font-size:14px;
  font-weight:700;

  margin-bottom:4px;
}

.more-text p{
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}

.more-arrow{
  color:var(--arrow);
  font-size:12px;
  margin-left:10px;
}


/* ==========================================
   SPECIAL CONNECT
========================================== */

.connect-item .more-icon{
  color:#22c55e;
  background:
    rgba(34,197,94,.10);
}


/* ==========================================
   VERSION
========================================== */

.version{
  text-align:center;

  color:var(--muted2);

  font-size:10px;

  margin-top:25px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:5px;
}


/* ==========================================
   SECRET ADMIN BUTTON
========================================== */

.secret-admin-btn{
  width:24px;
  height:24px;

  border:1px solid var(--card-border);

  border-radius:7px;

  background:var(--card);

  color:var(--muted);

  font-size:10px;

  padding:0;

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;

  opacity:.75;

  transition:.2s;
}

.secret-admin-btn:active{
  transform:scale(.88);
}

.secret-admin-btn:hover{
  color:#168fe5;
  border-color:#168fe5;
}


/* ==========================================
   BOTTOM NAV
========================================== */

.bottom-nav{
  position:fixed;

  left:50%;

  transform:
    translateX(-50%);

  bottom:0;

  width:100%;

  max-width:520px;

  height:72px;

  padding:
    8px
    18px
    12px;

  background:var(--nav-bg);

  border-top:
    1px solid
    var(--nav-border);

  backdrop-filter:
    blur(15px);

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  z-index:100;
}

.nav-item{
  border:none;

  background:none;

  color:var(--muted2);

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:5px;

  font-size:10px;

  cursor:pointer;
}

.nav-item i{
  font-size:17px;
}

.nav-item.active{
  color:#168fe5;
}

.nav-item:active{
  transform:scale(.94);
}


/* ==========================================
   PAGE LOADING
========================================== */

.page-loader{
  position:fixed;

  inset:0;

  background:var(--loader-bg);

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  opacity:0;

  visibility:hidden;

  transition:.2s;

  z-index:9999;
}

.page-loader.show{
  opacity:1;
  visibility:visible;
}

.loader-spinner{
  width:34px;
  height:34px;

  border:
    3px solid
    var(--loader-border);

  border-top-color:#168fe5;

  border-radius:50%;

  animation:
    spin .7s linear infinite;

  margin-bottom:12px;
}

.loader-text{
  color:var(--muted);
  font-size:12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* ==========================================
   ADMIN POPUP
========================================== */

.admin-overlay{
  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:
    blur(8px);

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  opacity:0;

  visibility:hidden;

  transition:
    opacity .2s,
    visibility .2s;

  z-index:20000;
}

.admin-overlay.show{
  opacity:1;
  visibility:visible;
}

.admin-popup{
  width:100%;

  max-width:360px;

  background:var(--popup);

  border:
    1px solid
    var(--card-border);

  border-radius:22px;

  padding:24px;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.5);

  transform:
    translateY(15px)
    scale(.96);

  transition:
    transform .2s;
}

.admin-overlay.show .admin-popup{
  transform:
    translateY(0)
    scale(1);
}

.admin-popup-icon{
  width:48px;
  height:48px;

  margin:0 auto 15px;

  border-radius:15px;

  background:
    rgba(22,143,229,.12);

  color:#168fe5;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:18px;
}

.admin-popup h2{
  text-align:center;

  font-size:18px;

  margin-bottom:6px;
}

.admin-popup p{
  text-align:center;

  color:var(--muted);

  font-size:12px;

  margin-bottom:20px;
}

.admin-password{
  width:100%;

  height:48px;

  border:
    1px solid
    var(--input-border);

  border-radius:13px;

  background:var(--input);

  color:var(--text);

  outline:none;

  padding:
    0 14px;

  font-size:14px;

  text-align:center;

  margin-bottom:12px;
}

.admin-password:focus{
  border-color:#168fe5;

  box-shadow:
    0 0 0 3px
    rgba(22,143,229,.10);
}

.admin-error{
  text-align:center;

  color:#ef4444;

  font-size:11px;

  min-height:16px;

  margin-bottom:10px;

  display:none;
}

.admin-buttons{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;
}

.admin-cancel,
.admin-login{
  height:44px;

  border:none;

  border-radius:12px;

  font-size:13px;

  font-weight:600;

  cursor:pointer;
}

.admin-cancel{
  background:var(--cancel);

  color:var(--cancel-text);
}

.admin-login{
  background:#168fe5;

  color:#fff;
}

.admin-cancel:active,
.admin-login:active{
  transform:scale(.97);
}


/* ==========================================
   RESPONSIVE
========================================== */

@media(max-width:360px){

  .page{
    padding-left:14px;
    padding-right:14px;
  }

  .more-item{
    padding:14px;
  }

  .more-icon{
    width:42px;
    height:42px;
  }

}

</style>

</head>


<body>

<script>

/* ==========================================
   THEME
========================================== */

(function(){

  const systemThemeQuery =
    window.matchMedia(
      "(prefers-color-scheme: dark)"
    );


  function applyTheme(){

    const theme =
      localStorage.getItem(
        "myvtu_theme"
      ) || "system";


    const isDark =
      theme === "dark" ||
      (
        theme === "system" &&
        systemThemeQuery.matches
      );


    document.documentElement.classList.toggle(
      "dark-theme",
      isDark
    );

    document.documentElement.classList.toggle(
      "light-theme",
      !isDark
    );

  }


  applyTheme();


  systemThemeQuery.addEventListener(
    "change",
    function(){

      const theme =
        localStorage.getItem(
          "myvtu_theme"
        ) || "system";


      if(theme === "system"){
        applyTheme();
      }

    }
  );

})();


/* ==========================================
   DIRECT PAGE NAVIGATION
========================================== */

let navigating = false;


function goTo(page){

  if(navigating){
    return;
  }

  navigating = true;


  const loader =
    document.getElementById(
      "pageLoader"
    );


  loader.classList.add("show");


  setTimeout(
    function(){

      window.location.href =
        page;

    },
    250
  );

}


/* ==========================================
   PREVENT DOUBLE TAP
========================================== */

document.addEventListener(
  "click",
  function(event){

    const button =
      event.target.closest(
        "button"
      );


    if(
      button &&
      button.getAttribute("onclick") &&
      button
        .getAttribute("onclick")
        .includes("goTo")
    ){

      button.style.pointerEvents =
        "none";

    }

  }
);


/* ==========================================
   OPEN ADMIN
========================================== */

function openAdmin(){

  const overlay =
    document.getElementById(
      "adminOverlay"
    );

  const password =
    document.getElementById(
      "adminPassword"
    );

  const error =
    document.getElementById(
      "adminError"
    );


  overlay.classList.add("show");

  password.value = "";

  error.style.display = "none";


  setTimeout(
    function(){

      password.focus();

    },
    200
  );

}


/* ==========================================
   CLOSE ADMIN
========================================== */

function closeAdmin(){

  document
    .getElementById(
      "adminOverlay"
    )
    .classList.remove("show");

}


/* ==========================================
   CLOSE OUTSIDE
========================================== */

function closeAdminOutside(event){

  if(
    event.target.id ===
    "adminOverlay"
  ){

    closeAdmin();

  }

}


/* ==========================================
   CHECK ADMIN PASSWORD
========================================== */

function checkAdminPassword(){

  const password =
    document
      .getElementById(
        "adminPassword"
      )
      .value
      .trim();


  const error =
    document.getElementById(
      "adminError"
    );


  if(password === "ad1"){

    window.location.href =
      "admin.html";

    return;

  }


  error.style.display =
    "block";

}


/* ==========================================
   ENTER KEY
========================================== */

document
  .getElementById(
    "adminPassword"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        checkAdminPassword();

      }

    }
  );

</script>
