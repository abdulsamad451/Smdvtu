<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-page">

  <div class="brand">

    <div class="brand-icon">
      <i class="fa-solid fa-wallet"></i>
    </div>

    <h1>MyVTU</h1>

    <p>Power your everyday payments</p>

  </div>


  <div class="auth-card">

    <h2>Welcome Back</h2>

    <p class="subtitle">
      Login to access your wallet.
    </p>


    <form id="loginForm">

      <label>Email Address</label>

      <div class="input-box">

        <i class="fa-regular fa-envelope"></i>

        <input
          type="email"
          id="loginEmail"
          placeholder="you@example.com"
          required>

      </div>


      <label>Password</label>

      <div class="input-box">

        <i class="fa-solid fa-lock"></i>

        <input
          type="password"
          id="loginPassword"
          placeholder="Your password"
          required>

        <button
          type="button"
          class="show-password"
          onclick="togglePassword('loginPassword', this)">

          <i class="fa-regular fa-eye"></i>

        </button>

      </div>


      <div id="loginMessage" class="message"></div>


      <button type="submit" class="auth-button">

        Login

        <i class="fa-solid fa-arrow-right"></i>

      </button>

    </form>

<div id="biometricLoginBox" class="biometric-login-box">

  <div class="biometric-divider">
    <span>OR</span>
  </div>

  <button
    type="button"
    id="biometricLoginButton"
    class="biometric-button"
    onclick="loginWithBiometrics()">

    <i class="fa-solid fa-fingerprint"></i>

    <span>Login with Biometrics</span>

  </button>

</div>
    <p class="bottom-text">

      Don't have an account?

      <a href="register.html">Create Account</a>

    </p>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

</body>
</html>
