<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password - MyVTU</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="auth.css">

  <style>
    .back-login {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #168fe5;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .success-box {
      display: none;
      background: #151515;
      border: 1px solid #28734a;
      color: #7ee2a8;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="auth-page">

  <div class="brand">

    <div class="brand-icon">
      <i class="fa-solid fa-wallet"></i>
    </div>

    <h1>MyVTU</h1>

    <p>Power your everyday payments</p>

  </div>

  <div class="auth-card">

    <h2>Forgot Password?</h2>

    <p class="subtitle">
      Enter your email and we'll send you a password reset link.
    </p>

    <form id="forgotPasswordForm">

      <label>Email Address</label>

      <div class="input-box">

        <i class="fa-regular fa-envelope"></i>

        <input
          type="email"
          id="forgotEmail"
          placeholder="you@example.com"
          required
        >

      </div>

      <div
        id="forgotMessage"
        class="message"
        style="display:none;">
      </div>

      <button
        type="submit"
        class="auth-button"
        id="forgotButton">

        Send Reset Link

        <i class="fa-solid fa-paper-plane"></i>

      </button>

    </form>

    <a
      href="login.html"
      class="back-login">

      <i class="fa-solid fa-arrow-left"></i>
      Back to Login

    </a>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://gthosvtitmymsrbynmuq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_YJ8SqAQQt9Fk3QtOlHUFZg_Q0ZC2fFT";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const form =
  document.getElementById(
    "forgotPasswordForm"
  );

const message =
  document.getElementById(
    "forgotMessage"
  );

const button =
  document.getElementById(
    "forgotButton"
  );


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
      document
        .getElementById("forgotEmail")
        .value
        .trim();

    message.style.display = "block";
    message.className = "message success";
    message.innerText =
      "Sending password reset link...";

    button.disabled = true;

    try {

      const {
        error
      } =
      await supabaseClient.auth
        .resetPasswordForEmail(
          email,
          {
            redirectTo:
              window.location.origin +
              "/reset-password.html"
          }
        );

      if (error) {

        console.error(
          "Password reset error:",
          error
        );

        message.className =
          "message";

        message.innerText =
          error.message;

        return;
      }

      message.className =
        "message success";

      message.innerText =
        "Password reset link sent. Please check your email and follow the link to create a new password.";

    } catch (error) {

      console.error(
        "Forgot password error:",
        error
      );

      message.className =
        "message";

      message.innerText =
        "Something went wrong. Please try again.";

    } finally {

      button.disabled = false;

    }

  }
);

</script>

</body>
</html>
