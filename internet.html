<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Internet Data - MyVTU</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  background:#080b10;
  color:#fff;
}

.page{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:20px 18px 120px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.back{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:#141922;
  color:#fff;
  font-size:17px;
}

.header h1{
  font-size:22px;
  font-weight:750;
}

.history{
  width:42px;
  height:42px;
  border:none;
  border-radius:14px;
  background:#141922;
  color:#aaa;
  font-size:16px;
}

/* BALANCE */

.balance{
  position:relative;
  overflow:hidden;
  padding:23px;
  border-radius:25px;
  margin-bottom:22px;
  background:linear-gradient(135deg,#087fe5,#1454d9);
  box-shadow:0 15px 35px rgba(0,100,255,.18);
}

.balance:after{
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  border-radius:50%;
  right:-70px;
  top:-75px;
  background:rgba(255,255,255,.08);
}

.balance small{
  color:#d9eaff;
  font-size:13px;
}

.balance-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:7px;
}

.balance h2{
  font-size:31px;
  letter-spacing:-1px;
}

.balance-icon{
  width:43px;
  height:43px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.14);
}

/* SECTION */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:24px 2px 10px;
}

.section-title h3{
  font-size:15px;
}

.section-title span{
  color:#777;
  font-size:12px;
}

/* PHONE */

.input-wrap{
  background:#11151c;
  border:1px solid #202632;
  border-radius:17px;
  display:flex;
  align-items:center;
  padding:0 15px;
}

.input-wrap i{
  color:#168fe5;
  font-size:16px;
  margin-right:11px;
}

.input-wrap input{
  flex:1;
  border:none;
  outline:none;
  background:none;
  color:white;
  padding:17px 0;
  font-size:16px;
}

.input-wrap input::placeholder{
  color:#606773;
}

/* NETWORKS */

.networks{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.network{
  border:1px solid #202632;
  background:#11151c;
  color:#aaa;
  border-radius:17px;
  padding:13px 4px;
  font-size:12px;
  font-weight:700;
  transition:.2s;
}

.network i{
  display:block;
  font-size:18px;
  margin-bottom:7px;
}

.network.active{
  background:#102d48;
  border-color:#168fe5;
  color:#fff;
}

/* PLANS */

.plans{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.plan{
  position:relative;
  border:1px solid #202632;
  background:#11151c;
  color:white;
  border-radius:19px;
  padding:17px 14px;
  text-align:left;
  min-height:105px;
  transition:.2s;
}

.plan:active{
  transform:scale(.98);
}

.plan.selected{
  background:#0e2940;
  border-color:#168fe5;
  box-shadow:0 0 0 1px rgba(22,143,229,.15);
}

.plan-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.data-icon{
  width:34px;
  height:34px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#19212c;
  color:#168fe5;
}

.check{
  width:22px;
  height:22px;
  border-radius:50%;
  display:none;
  align-items:center;
  justify-content:center;
  background:#168fe5;
  font-size:10px;
}

.plan.selected .check{
  display:flex;
}

.plan-name{
  font-size:14px;
  font-weight:700;
  line-height:1.35;
}

.plan-duration{
  color:#707985;
  font-size:11px;
  margin-top:5px;
}

.plan-price{
  color:#39a5ff;
  font-weight:800;
  font-size:15px;
  margin-top:10px;
}

/* LOADING */

.loading{
  grid-column:1/-1;
  text-align:center;
  color:#707985;
  padding:35px 0;
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid #252d38;
  border-top-color:#168fe5;
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:100%;
  max-width:520px;
  padding:13px 18px 18px;
  background:linear-gradient(transparent,#080b10 25%);
  z-index:10;
}

.buy{
  width:100%;
  border:none;
  border-radius:18px;
  padding:17px;
  background:#168fe5;
  color:#fff;
  font-size:16px;
  font-weight:800;
  box-shadow:0 10px 30px rgba(22,143,229,.25);
}

.buy:disabled{
  opacity:.45;
  box-shadow:none;
}

.notice{
  display:flex;
  gap:9px;
  margin-top:18px;
  padding:14px;
  border-radius:16px;
  background:#10141a;
  color:#69717d;
  font-size:11px;
  line-height:1.5;
}

.notice i{
  color:#168fe5;
  margin-top:2px;
}

.error{
  grid-column:1/-1;
  text-align:center;
  color:#ff7070;
  padding:30px 5px;
  font-size:13px;
}

/* POPUP */

.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  opacity:0;
  visibility:hidden;
  transition:.25s;
  z-index:9999;
}

.popup-overlay.show{
  opacity:1;
  visibility:visible;
}

.popup{
  width:100%;
  max-width:360px;
  background:#11151c;
  border:1px solid #252d38;
  border-radius:25px;
  padding:25px 20px 20px;
  text-align:center;
  transform:translateY(20px) scale(.96);
  transition:.25s;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.popup-overlay.show .popup{
  transform:translateY(0) scale(1);
}

.popup-icon{
  width:65px;
  height:65px;
  border-radius:50%;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
}

.popup.success .popup-icon{
  background:rgba(34,197,94,.14);
  color:#22c55e;
}

.popup.error .popup-icon{
  background:rgba(239,68,68,.14);
  color:#ef4444;
}

.popup.pending .popup-icon{
  background:rgba(245,158,11,.14);
  color:#f59e0b;
}

.popup.processing .popup-icon{
  background:rgba(22,143,229,.14);
  color:#168fe5;
}

.popup.pin .popup-icon{
  background:rgba(22,143,229,.14);
  color:#168fe5;
}

.popup h2{
  font-size:20px;
  margin-bottom:8px;
}

.popup-message{
  color:#929aa6;
  font-size:14px;
  line-height:1.5;
  margin-bottom:20px;
}

.popup-details{
  background:#0b0f14;
  border-radius:15px;
  padding:13px;
  margin-bottom:18px;
  text-align:left;
}

.popup-detail{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:5px 0;
  font-size:13px;
}

.popup-detail span:first-child{
  color:#707985;
}

.popup-detail span:last-child{
  color:#fff;
  font-weight:600;
  text-align:right;
}

.popup-button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  background:#168fe5;
  color:#fff;
  font-size:15px;
  font-weight:700;
}

.popup-button:active{
  transform:scale(.98);
}

.popup.processing .popup-button{
  display:none;
}

/* PIN */

.pin-input{
  width:100%;
  border:1px solid #252d38;
  background:#0b0f14;
  border-radius:16px;
  padding:16px;
  color:#fff;
  text-align:center;
  font-size:25px;
  font-weight:800;
  letter-spacing:9px;
  outline:none;
  margin-bottom:12px;
}

.pin-input:focus{
  border-color:#168fe5;
}

.pin-input::placeholder{
  color:#4e5662;
  letter-spacing:6px;
}

.pin-forgot{
  display:block;
  border:0;
  background:none;
  color:#168fe5;
  font-size:12px;
  margin:2px auto 17px;
}

.pin-button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  background:#168fe5;
  color:#fff;
  font-size:15px;
  font-weight:700;
}

.pin-button:disabled{
  opacity:.5;
}

.pin-cancel{
  width:100%;
  border:0;
  background:none;
  color:#777f8a;
  padding:12px 5px 2px;
  font-size:13px;
}

.pin-error{
  color:#ff7070;
  font-size:12px;
  min-height:18px;
  margin-bottom:8px;
}

/* PROCESSING SPINNER */

.processing-spinner{
  width:30px;
  height:30px;
  border:3px solid rgba(22,143,229,.20);
  border-top-color:#168fe5;
  border-radius:50%;
  animation:popupSpin .8s linear infinite;
}

@keyframes popupSpin{
  to{
    transform:rotate(360deg);
  }
}
/* DATA TYPES */

.data-types {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.data-types::-webkit-scrollbar {
  display: none;
}

.data-type {
  flex: 0 0 auto;
  min-width: 92px;
  border: 1px solid #202632;
  background: #11151c;
  color: #aaa;
  border-radius: 16px;
  padding: 12px 13px;
  font-size: 11px;
  font-weight: 700;
  transition: .2s;
}

.data-type i {
  display: block;
  font-size: 17px;
  margin-bottom: 6px;
  color: #168fe5;
}

.data-type.active {
  background: #102d48;
  border-color: #168fe5;
  color: #fff;
}

.data-type.active i {
  color: #fff;
}
@media(max-width:360px){

  .plans{
    grid-template-columns:1fr;
  }

  .networks{
    grid-template-columns:repeat(2,1fr);
  }

}

</style>
</head>

<body>

<div class="page">

  <!-- HEADER -->

  <div class="header">

    <div class="header-left">

      <button class="back" onclick="history.back()">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <h1>Internet Data</h1>

    </div>

    <button class="history"
      onclick="location.href='transaction-history.html'">

      <i class="fa-solid fa-clock-rotate-left"></i>

    </button>

  </div>


  <!-- BALANCE -->

  <div class="balance">

    <small>Available Balance</small>

    <div class="balance-row">

      <h2 id="currentBalance">₦0.00</h2>

      <div class="balance-icon">
        <i class="fa-solid fa-wallet"></i>
      </div>

    </div>

  </div>


  <!-- PHONE -->

  <div class="section-title">

    <h3>Phone Number</h3>

    <span>Recipient</span>

  </div>

  <div class="input-wrap">

    <i class="fa-solid fa-mobile-screen"></i>

    <input
      id="phone"
      type="tel"
      inputmode="numeric"

  </div>


  <!-- NETWORK -->

      data-network="GLO"

    <button
      class="network"
      data-network="9MOBILE"
      onclick="selectNetwork(this)">

      <i class="fa-solid fa-bars-staggered"></i>
      9mobile

    </button>

<!-- DATA TYPE -->

  <h3>Data Type</h3>

  <span>Select category</span>

</div>

<div class="data-types" id="dataTypes">

  <button
    class="data-type active"
    data-type="ALL"
    onclick="selectDataType(this)">

    <i class="fa-solid fa-layer-group"></i>

    <span>All</span>

  </button>

</div>


<!-- PLANS -->

<div class="section-title">

  <h3>Choose Data Plan</h3>

  <span id="planCount"></span>

</div>

<div class="plans" id="plans">

  <div class="loading">

    <div class="spinner"></div>

    Loading plans...

  </div>

</div>

  <!-- NOTICE -->

  <div class="notice">

    <i class="fa-solid fa-shield-halved"></i>

    <div>
      Data is delivered directly to the selected
      phone number after your payment is confirmed.
    </div>

  </div>

</div>


<!-- BUY BUTTON -->

<div class="bottom">

  <button
    class="buy"
    id="continueButton"
    onclick="buyData()"
    disabled>

    Select a data plan

  </button>

</div>


<!-- POPUP -->

<div
  class="popup-overlay"
  id="popupOverlay"
  onclick="closePopupFromOutside(event)"
>

  <div class="popup" id="popupBox">

    <div class="popup-icon" id="popupIcon">

      <i id="popupIconSymbol"></i>

    </div>

    <h2 id="popupTitle">Notification</h2>

    <div class="popup-message" id="popupMessage"></div>

    <!-- PIN AREA -->

    <div id="pinArea" style="display:none">

      <input
        id="purchasePin"
        class="pin-input"
        type="password"
        inputmode="numeric"
        maxlength="4"
        autocomplete="off"
        placeholder="••••">

      <div
        id="pinError"
        class="pin-error">
      </div>

      <button
        class="pin-button"
        id="verifyPinButton"

        Verify PIN

      </button>

      <button

        Cancel

      </button>

    <!-- NORMAL DETAILS -->

    <div
      class="popup-details"

      style="display:none">
    </div>

      Continue

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://gthosvtitmymsrbynmuq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YJ8SqAQQt9Fk3QtOlHUFZg_Q0ZC2fFT";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let selectedNetwork = "MTN";
let allPlans = [];

let selectedDataType = "ALL";
let selectedPlan = null;

let purchaseProcessing = false;

let pinVerificationProcessing = false;


/* ==========================================
   LOAD USER
========================================== */

async function loadUser(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();


  if(!session){

    location.href="login.html";

    return;

  }


  const {
    data:profile,
    error
  } =
  await supabaseClient
  .from("profiles")
  .select("balance")
  .eq("id",session.user.id)
  .single();


  if(error){

    console.error(error);

    return;

  }


  document.getElementById(
    "currentBalance"
  ).innerText =
  "₦"+
  Number(
    profile.balance || 0
  ).toLocaleString(
    "en-NG",
    {
      minimumFractionDigits:2
    }
  );


  loadPlans();

}


/* ==========================================
   NETWORK
========================================== */

function selectNetwork(button){

  if(purchaseProcessing){
    return;
  }


  document
  .querySelectorAll(".network")
  .forEach(
    item =>
      item.classList.remove("active")
  );


  button.classList.add("active");


  selectedNetwork =
  button.dataset.network;


  selectedPlan=null;


  const buy =
    document.getElementById(
      "continueButton"
    );


  buy.disabled=true;

  buy.innerText=
    "Select a data plan";


  loadPlans();

}


/* ==========================================
   SERVICE ID
========================================== */

function getServiceID(network){

  const services={

    MTN:"mtn-data",

    AIRTEL:"airtel-data",

    GLO:"glo-data",

    "9MOBILE":"etisalat-data"

  };


  return services[network];

}


/* ==========================================
   LOAD PLANS
========================================== */

async function loadPlans(){

  const container =
    document.getElementById("plans");


  container.innerHTML=`

    <div class="loading">

      <div class="spinner"></div>

      Loading plans...

    </div>

  `;


  const serviceID =
  getServiceID(selectedNetwork);

try {
  
  const {
    data: {
      session
    }
  } =
  await supabaseClient.auth.getSession();
  
  if (!session) {
    
    location.href = "login.html";
    
    return;
    
  }
  
  const response =
    await fetch(
      
      `${SUPABASE_URL}/functions/v1/get-data-plans?network=${encodeURIComponent(selectedNetwork)}`,
      
      {

        method:"GET",

        headers:{

          "Authorization":
          `Bearer ${session.access_token}`,

          "apikey":
          SUPABASE_KEY,

          "Content-Type":
          "application/json"

        }

      }

    );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Unable to load plans."
      );

    }


    displayPlans(data.plans || []);


  }catch(error){

    console.error(error);


    container.innerHTML=`

      <div class="error">

        Unable to load data plans.<br>

        Please try again.

      </div>

    `;

  }

}


/* ==========================================
   DISPLAY PLANS
========================================== */

function displayPlans(plans) {
  
  allPlans = Array.isArray(plans) ?
    plans :
    [];
  
  buildDataTypes();
  
  renderFilteredPlans();
  
}
function normalizeType(plan) {
  
  const possibleTypes = [
    
    plan.type,
    
    plan.plan_type,
    
    plan.planType,
    
    plan.category,
    
    plan.category_name,
    
    plan.family,
    
    plan.family_name,
    
    plan.product_type
    
  ];
  
  for (const value of possibleTypes) {
    
    if (value !== undefined &&
      value !== null &&
      String(value).trim() !== "") {
      
      return normalizeTypeName(value);
      
    }
    
  }
  
  /*
    If VTUGATE does not provide a type,
    use the plan name as a fallback.
  */
  
  return detectTypeFromName(plan.name);
  
}
function normalizeTypeName(value) {
  
  const text =
    String(value)
    .trim()
    .toUpperCase();
  
  if (
    text.includes("SME")
  ) {
    return "SME";
  }
  
  if (
    text.includes("GIFT")
  ) {
    return "GIFTING";
  }
  
  if (
    text === "CG" ||
    text.includes("CORPORATE GIFT")
  ) {
    return "CG";
  }
  
  if (
    text === "DG" ||
    text.includes("DATA GIFT")
  ) {
    return "DG";
  }
  
  if (
    text.includes("CORPORATE")
  ) {
    return "CORPORATE";
  }
  
  return text;
  
}
function detectTypeFromName(name) {
  
  const text =
    String(name || "")
    .toUpperCase();
  
  if (text.includes("SME")) {
    return "SME";
  }
  
  if (
    text.includes("GIFT") ||
    text.includes("GIFTING")
  ) {
    return "GIFTING";
  }
  
  if (
    text.includes("CORPORATE GIFT")
  ) {
    return "CG";
  }
  
  if (
    text.includes("DATA GIFT")
  ) {
    return "DG";
  }
  
  if (text.includes("CORPORATE")) {
    return "CORPORATE";
  }
  
  return "OTHER";
  
}
function buildDataTypes() {
  
  const container =
    document.getElementById("dataTypes");
  
  container.innerHTML = "";
  
  const types = [
    "ALL",
    ...new Set(
      allPlans.map(plan =>
        normalizeType(plan)
      )
    )
  ];
  
  types.forEach(type => {
    
    const button =
      document.createElement("button");
    
    button.className =
      "data-type" +
      (
        type === selectedDataType ?
        " active" :
        ""
      );
    
    button.dataset.type = type;
    
    const icon =
      getDataTypeIcon(type);
    
    button.innerHTML = `

      <i class="${icon}"></i>

      <span>
        ${escapeHTML(
          type === "ALL"
            ? "All"
            : type
        )}
      </span>

    `;
    
    button.onclick = () => {
      
      selectDataType(button);
      
    };
    
    container.appendChild(button);
    
  });
  
}
function getDataTypeIcon(type) {
  
  switch (type) {
    
    case "SME":
      return "fa-solid fa-users";
      
    case "GIFTING":
      return "fa-solid fa-gift";
      
    case "CORPORATE":
      return "fa-solid fa-building";
      
    case "CG":
      return "fa-solid fa-building-circle-check";
      
    case "DG":
      return "fa-solid fa-hand-holding-heart";
      
    case "OTHER":
      return "fa-solid fa-box";
      
    default:
      return "fa-solid fa-layer-group";
      
  }
  
}
function selectDataType(button) {
  
  if (purchaseProcessing) {
    return;
  }
  
  document
    .querySelectorAll(".data-type")
    .forEach(item => {
      
      item.classList.remove("active");
      
    });
  
  button.classList.add("active");
  
  selectedDataType =
    button.dataset.type;
  
  selectedPlan = null;
  
  const buy =
    document.getElementById(
      "continueButton"
    );
  
  buy.disabled = true;
  
  buy.innerText =
    "Select a data plan";
  
  renderFilteredPlans();
  
}
function renderFilteredPlans() {
  
  const container =
    document.getElementById("plans");
  
  container.innerHTML = "";
  
  let filtered =
    allPlans.filter(plan => {
      
      const amount =
        Number(plan.variation_amount);
      
      return (
        Number.isFinite(amount) &&
        amount > 0 &&
        amount <= 20000
      );
      
    });
  
  /*
    Only filter by type when the
    user selected a specific category.
  */
  
  if (selectedDataType !== "ALL") {
    
    filtered =
      filtered.filter(plan => {
        
        return (
          normalizeType(plan) ===
          selectedDataType
        );
        
      });
    
  }
  
  document.getElementById(
      "planCount"
    ).innerText =
    filtered.length +
    " plans";
  
  
  if (!filtered.length) {
    
    container.innerHTML = `

      <div class="error">

        No ${escapeHTML(
          selectedDataType === "ALL"
            ? ""
            : selectedDataType + " "
        )}data plans available.

      </div>

    `;
    
    return;
    
  }
  
  
  filtered.forEach(plan => {
    
    const button =
      document.createElement("button");
    
    button.className = "plan";
    
    const amount =
      Number(plan.variation_amount);
    
    const type =
      normalizeType(plan);
    
    const validity =
      plan.validity ||
      "Instant delivery";
    
    
    button.innerHTML = `

      <div style="width:100%">

        <div class="plan-top">

          <div class="data-icon">

            <i class="fa-solid fa-database"></i>

          </div>

          <div class="check">

            <i class="fa-solid fa-check"></i>

          </div>

        </div>


        <div class="plan-name">

          ${escapeHTML(plan.name)}

        </div>


        <div class="plan-duration">

          ${escapeHTML(
            type +
            (
              validity
                ? " • " + validity
                : ""
            )
          )}

        </div>


        <div class="plan-price">

          ₦${amount.toLocaleString("en-NG")}

        </div>

      </div>

    `;
    
    
    button.onclick = () => {
      
      if (purchaseProcessing) {
        return;
      }
      
      
      document
        .querySelectorAll(".plan")
        .forEach(item => {
          
          item.classList.remove(
            "selected"
          );
          
        });
      
      
      button.classList.add(
        "selected"
      );
      
      
      selectedPlan = plan;
      
      
      const buy =
        document.getElementById(
          "continueButton"
        );
      
      
      buy.disabled = false;
      
      buy.innerText =
        "Buy Data • ₦" +
        amount.toLocaleString(
          "en-NG"
        );
      
    };
    
    
    container.appendChild(
      button
    );
    
  });
  
}


/* ==========================================
   SHOW NORMAL POPUP
========================================== */

function showPopup(
  type,
  title,
  message,
  details={}
){

  const overlay =
    document.getElementById("popupOverlay");

  const box =
    document.getElementById("popupBox");

  const icon =
    document.getElementById("popupIconSymbol");

  const popupTitle =
    document.getElementById("popupTitle");

  const popupMessage =
    document.getElementById("popupMessage");

  const popupDetails =
    document.getElementById("popupDetails");

  const popupButton =
    document.getElementById("popupButton");

  const pinArea =
    document.getElementById("pinArea");


  box.className =
    "popup " + type;


  pinArea.style.display="none";


  popupButton.style.display="block";


  if(type==="success"){

    icon.className="fa-solid fa-check";

  }

  else if(type==="pending"){

    icon.className="fa-solid fa-clock";

  }

  else{

    icon.className="fa-solid fa-xmark";

  }


  popupTitle.innerText=title;

  popupMessage.innerText=message;


  const keys =
    Object.keys(details);


  if(keys.length){

    popupDetails.style.display="block";


    popupDetails.innerHTML =
      keys.map(key=>`

        <div class="popup-detail">

          <span>
            ${escapeHTML(key)}
          </span>

          <span>
            ${escapeHTML(details[key])}
          </span>

        </div>

      `).join("");

  }

  else{

    popupDetails.style.display="none";

    popupDetails.innerHTML="";

  }


  overlay.classList.add("show");

}

/* ==========================================
   VERIFY PURCHASE PIN
========================================== */

async function verifyPurchasePin(){

  if(pinVerificationProcessing){
    return;
  }


  const pinInput =
    document.getElementById("purchasePin");


  const pinError =
    document.getElementById("pinError");


  const verifyButton =
    document.getElementById("verifyPinButton");


  const pin =
    pinInput.value.trim();


  if(!/^\d{4}$/.test(pin)){

    pinError.innerText=
      "Please enter your 4-digit PIN.";

    pinInput.focus();

    return;

  }


  pinVerificationProcessing=true;

  verifyButton.disabled=true;

  verifyButton.innerText=
    "Verifying...";

  pinError.innerText="";


  try{

    const {
      data:{
        session
      }
    } =
    await supabaseClient.auth.getSession();


    if(!session){

      location.href="login.html";

      return;

    }


    /*
      Call manage-pin Edge Function
    */

    const {
      data,
      error
    } =
    await supabaseClient.functions.invoke(
      "manage-pin",
      {
        body:{
          action:"verify",
          pin:pin
        }
      }
    );


    console.log(
      "manage-pin response:",
      data
    );


    if(error){

      console.error(
        "manage-pin error:",
        error
      );


      pinError.innerText=
        error.message ||
        "PIN verification failed.";

      return;

    }


    if(!data?.success){

      pinError.innerText=
        data?.message ||
        "Incorrect PIN.";

      pinInput.value="";

      pinInput.focus();

      return;

    }


    /*
      PIN CORRECT
      Close PIN popup then start purchase
    */

    closePopup();


    await processDataPurchase();


  }

  catch(error){

    console.error(error);


    pinError.innerText=
      "PIN verification failed. Please try again.";

  }

  finally{

    pinVerificationProcessing=false;

    verifyButton.disabled=false;

    verifyButton.innerText=
      "Verify PIN";

  }

}


/* ==========================================
   BUY DATA
========================================== */

async function buyData(){

  if(purchaseProcessing){
    return;
  }


  const phone =
    document.getElementById("phone")
    .value
    .trim();


  if(!/^0\d{10}$/.test(phone)){

    showPopup(
      "error",
      "Invalid Number",
      "Please enter a valid Nigerian phone number."
    );

    return;

  }


  if(!selectedPlan){

    showPopup(
      "error",
      "No Plan Selected",
      "Please select a data plan before continuing."
    );

    return;

  }


  /*
    IMPORTANT:
    Do NOT buy immediately.

    First ask for PIN.
  */

  showPinPopup();

}


/* ==========================================
   PROCESS DATA PURCHASE
========================================== */

async function processDataPurchase(){

  if(purchaseProcessing){
    return;
  }

  const phone =
    document.getElementById("phone")
    .value
    .trim();

  if(!selectedPlan){

    showPopup(
      "error",
      "No Plan Selected",
      "Please select a data plan."
    );

    return;
  }

  const amount =
    Number(selectedPlan.variation_amount);

  /*
    IMPORTANT:
    Use the service_id and code from
    the EXACT plan the user selected.
  */

  const serviceId =
    String(
      selectedPlan.service_id || ""
    ).trim();

  const planCode =
    String(
      selectedPlan.code ||
      selectedPlan.variation_code ||
      ""
    ).trim();

  console.log("===== DATA PURCHASE =====");
  console.log("Network:", selectedNetwork);
  console.log("Phone:", phone);
  console.log("Amount:", amount);
  console.log("Service ID:", serviceId);
  console.log("Plan Code:", planCode);
  console.log("Selected Plan:", selectedPlan);
  console.log("=========================");

  if(!serviceId){

    showPopup(
      "error",
      "Missing Service ID",
      "This data plan does not have a VTUGATE service ID."
    );

    return;
  }

  if(!planCode){

    showPopup(
      "error",
      "Missing Plan Code",
      "This data plan does not have a VTUGATE plan code."
    );

    return;
  }

  const button =
    document.getElementById(
      "continueButton"
    );

  purchaseProcessing = true;

  button.disabled = true;

  showProcessingPopup();

  try{

    const {
      data,
      error
    } =
    await supabaseClient
    .functions
    .invoke(
      "buy-data",
      {
        body:{
  network:
    selectedNetwork,

  phone:
    phone,

  amount:
    amount,

  service_id:
    selectedPlan.service_id,

  plan_code:
    selectedPlan.code
}
      }
    );

    console.log(
      "buy-data response:",
      data
    );

    console.log(
      "buy-data error:",
      error
    );

    /* FUNCTION ERROR */

    if(error){

      console.error(
        "Function error:",
        error
      );

      purchaseProcessing = false;

      showPopup(
        "error",
        "Purchase Failed",
        "We could not process your data purchase.",
        {
          "Reason":
            error.message ||
            "Server error"
        }
      );

      return;
    }

    /* PENDING */

    if(data?.pending){

      purchaseProcessing = false;

      showPopup(
        "pending",
        "Purchase Pending",
        "Your data purchase is still being processed.",
        {
          "Network":
            selectedNetwork,

          "Phone":
            phone,

          "Amount":
            "₦" +
            amount.toLocaleString("en-NG"),

          "Request ID":
            data.requestId ||
            "Processing"
        }
      );

      return;
    }

    /* FAILED */

    if(!data?.success){

      purchaseProcessing = false;

      showPopup(
        "error",
        "Purchase Failed",
        data?.message ||
        "Your data purchase could not be completed.",
        {
          "Network":
            selectedNetwork,

          "Phone":
            phone,

          "Amount":
            "₦" +
            amount.toLocaleString("en-NG")
        }
      );

      return;
    }

    /* SUCCESS */

    purchaseProcessing = false;

    showPopup(
      "success",
      "Data Purchase Successful",
      "Your data bundle has been processed successfully.",
      {
        "Network":
          selectedNetwork,

        "Phone":
          phone,

        "Plan":
          selectedPlan.name,

        "Amount":
          "₦" +
          amount.toLocaleString("en-NG")
      }
    );

    setTimeout(
      () => {
        loadUser();
      },
      300
    );

  }

  catch(error){

    console.error(
      "buy-data error:",
      error
    );

    purchaseProcessing = false;

    showPopup(
      "error",
      "Something Went Wrong",
      error?.message ||
      "We could not complete the purchase. Please try again."
    );

  }

  finally{

    button.disabled = false;

    button.innerText =
      selectedPlan
      ?
      "Buy Data • ₦" +
      Number(
        selectedPlan.variation_amount
      ).toLocaleString("en-NG")
      :
      "Select a data plan";
  }

}

/* ==========================================
   CLOSE POPUP
========================================== */

function closePopup(){

  if(purchaseProcessing){
    return;
  }


  document
  .getElementById("popupOverlay")
  .classList.remove("show");

}


function closePopupFromOutside(event){

  if(
    event.target.id==="popupOverlay" &&
    !purchaseProcessing
  ){

    closePopup();

  }

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value){

  return String(value)

  .replaceAll("&","&amp;")

  .replaceAll("<","&lt;")

  .replaceAll(">","&gt;")

  .replaceAll('"',"&quot;")

  .replaceAll("'","&#039;");

}


/* ==========================================
   PIN ENTER KEY
========================================== */

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    const pin =
      document.getElementById(
        "purchasePin"
      );


    if(pin){

      pin.addEventListener(
        "input",
        ()=>{

          pin.value =
            pin.value
            .replace(/\D/g,"")
            .slice(0,4);

        }
      );


      pin.addEventListener(
        "keydown",
        event=>{

          if(
            event.key==="Enter"
          ){

            verifyPurchasePin();

          }

        }
      );

    }

  }
);
